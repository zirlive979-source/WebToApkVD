name: WebToApkVD Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WebToApkVD APK
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout repository
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v6

      # =========================
      # 2. Setup Java
      # =========================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================
      # 3. Setup Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # =========================
      # 4. Setup Gradle
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      # =========================
      # 5. Show environment
      # =========================
      - name: Check environment
        run: |
          java -version
          gradle --version
          adb version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # =========================
      # 6. Make Gradle executable
      # =========================
      - name: Prepare Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      # =========================
      # 7. Build Debug APK
      # =========================
      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # =========================
      # 8. Find generated APK
      # =========================
      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      # =========================
      # 9. Upload APK
      # =========================
      - name: Upload WebToApkVD APK
        uses: actions/upload-artifact@v4
        with:
          name: WebToApkVD-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
